[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fera-vla"
version = "0.1.0"
description = "Functional-equivalence pilot with simulator-grounded outcomes"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<2", "PyYAML>=6"]
[project.optional-dependencies]
analysis = ["scikit-learn>=1.3", "scipy>=1.10", "matplotlib>=3.7"]
train = ["torch>=2"]
[tool.setuptools.packages.find]
include = ["fera*"]
